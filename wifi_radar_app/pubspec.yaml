name: wifi_radar_app
description: Wi-Fi Human Motion Detection Radar App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Wi-Fi scanning
  wifi_scan: ^0.4.1
  wifi_info_flutter: ^2.0.2
  network_info_plus: ^4.1.0

  # Permissions
  permission_handler: ^11.0.1

  # UI & Animation
  flutter_animate: ^4.3.0
  animated_background: ^2.0.0

  # State management
  provider: ^6.1.1

  # Sensors
  sensors_plus: ^4.0.2

  # Math & Statistics
  collection: ^1.18.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/sounds/
